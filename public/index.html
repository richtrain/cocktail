function cardText(ctx,text,x,y,maxWidth,fontSize){ctx.font='700 '+fontSize+'px Arial, sans-serif';while(ctx.measureText(text).width>maxWidth&&fontSize>18){fontSize--;ctx.font='700 '+fontSize+'px Arial, sans-serif'}ctx.fillText(text,x,y)}
async function createShareCard(){const renderId=++cardRenderId,points=score,nickname=profile.nickname||'친구';const card=$('#share-card'),c=card.getContext('2d');cardFile=null;$('#send-card').disabled=true;if(cardObjectUrl){URL.revokeObjectURL(cardObjectUrl);cardObjectUrl=null}c.clearRect(0,0,1080,1080);if(shareTemplate)c.drawImage(shareTemplate,0,0,1080,1080);else{c.fillStyle='#0f403e';c.fillRect(0,0,1080,1080);c.textAlign='center';c.fillStyle='#fff2cb';cardText(c,'술찌야,',540,150,920,72);cardText(c,'너도 한잔할래?',540,245,940,72);glass(c,260,850,120,8);glass(c,820,850,120,9);c.font='32px Georgia';c.fillText('COCKTAIL CURLING',540,1020)}
c.save();c.textAlign='center';c.fillStyle='#fff4d5';c.shadowColor='#06322f';c.shadowBlur=8;cardText(c,nickname+'의 이번 기록',540,440,760,34);cardText(c,points.toLocaleString()+'점',540,565,850,105);c.fillStyle='#f2d593';cardText(c,'내 점수, 넘을 수 있겠어?',540,635,760,30);c.restore();shareData={title:'술찌야, 너도 한잔할래? · 칵테일 컬링',text:nickname+'의 기록 '+points.toLocaleString()+'점! 술찌야, 너도 한잔할래?',url:challengeUrl(points,profile.nickname)};$('#share-message').textContent='이번 판 '+points.toLocaleString()+'점으로 친구를 초대해요.';$('#copy-status').textContent='';try{const blob=await new Promise((resolve,reject)=>card.toBlob(b=>b?resolve(b):reject(Error('카드 생성 실패')),'image/png'));if(renderId!==cardRenderId)return;cardFile=new File([blob],'cocktail-'+points+'pts.png',{type:'image/png'});cardObjectUrl=URL.createObjectURL(blob);}catch{$('#copy-status').textContent='점수와 게임 링크로 공유할 수 있어요.'}if(renderId===cardRenderId)$('#send-card').disabled=false;
}
$('#share-round').onclick=()=>{if(phase!=='over')return;$('#share-dialog').showModal();createShareCard()};
function scoreSharePayload(){return {title:shareData.title,text:shareData.text+'\n'+shareData.url,url:shareData.url}}
async function copyScoreInvite(){const text=shareData.text+'\n'+shareData.url;try{await navigator.clipboard.writeText(text)}catch{const input=document.createElement('textarea');input.value=text;input.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(input);input.select();const copied=document.execCommand('copy');input.remove();if(!copied)throw Error('copy failed')}$('#copy-status').textContent='점수와 게임 링크를 복사했어요. 친구에게 붙여넣어 주세요.'}
$('#send-card').onclick=async()=>{if(!shareData)return;const button=$('#send-card');button.disabled=true;$('#copy-status').textContent='';try{const payload=scoreSharePayload();if(navigator.share){const withCard={...payload,files:cardFile?[cardFile]:[]};if(cardFile&&navigator.canShare&&navigator.canShare(withCard)){try{await navigator.share(withCard);return}catch(e){if(e.name==='AbortError')return;if(!['NotSupportedError','TypeError','DataError'].includes(e.name))throw e}}await navigator.share(payload);return}await copyScoreInvite()}catch(e){if(e.name!=='AbortError'){try{await copyScoreInvite()}catch{$('#copy-status').textContent='공유하지 못했어요. 다시 눌러 주세요.'}}}finally{button.disabled=false}};
const incoming=new URLSearchParams(location.search),target=Number(incoming.get('challenge'));if(incoming.has('challenge')&&Number.isInteger(target)&&target>=0&&target<=1000000){const from=(incoming.get('from')||'친구').slice(0,12);$('#challenge-note').textContent=from+'의 '+target.toLocaleString()+'점에 도전!';$('#challenge-note').hidden=false}

boot();
</script></body></html>
